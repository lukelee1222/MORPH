<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #f2f2f2; 
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
            transition: background-color 0.6s ease;
        }

        /* --- 1. 고정 헤더 --- */
        header {
            position: fixed; top: 25px; left: 25px; right: 25px; height: 90px;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; border-radius: 50px; 
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            padding: 0 40px;
        }
        
        .menu-trigger { position: absolute; left: 40px; display: flex; align-items: center; cursor: pointer; gap: 12px; }
        .burger-icon { display: flex; flex-direction: column; gap: 5px; }
        .burger-icon span { display: block; width: 22px; height: 2px; background-color: #000000; }
        .menu-text { font-size: 13px; font-weight: 500; }
        .logo { font-weight: 500; font-size: 22px; letter-spacing: 0.6em; color: #000000; text-decoration: none; cursor: pointer; }

        /* --- 2. 사이드 메뉴 --- */
        #sideMenu {
            position: fixed; top: 0; left: 0; width: 320px; height: 100vh;
            background-color: #e8e8e8; z-index: 9999; padding: 150px 50px 50px 50px;
            transform: translateX(-100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; 
            box-shadow: 20px 0 50px rgba(0,0,0,0.03);
        }
        #sideMenu.active { transform: translateX(0); }
        .menu-item { display: block; font-size: 16px; text-decoration: none; color: #000; margin-bottom: 30px; font-weight: 400; cursor: pointer; }
        .menu-item::after { content: " →"; }
        .close-btn { position: absolute; top: 55px; right: 40px; font-size: 13px; cursor: pointer; color: #999; }

        /* --- 3. 섹션 공통 스타일 --- */
        .content-section { 
            margin-top: 180px; 
            display: none; 
            opacity: 0; 
            transition: opacity 0.5s ease; 
        }

        /* --- 4. Archive 갤러리 --- */
        #archiveContent {
            justify-content: flex-start; gap: 20px; padding: 0 20px;
            max-width: 1400px; margin-left: auto; margin-right: auto;
        }
        .gallery-item {
            position: relative; flex: 1; min-width: 320px; aspect-ratio: 16 / 10;
            background-color: #dfdfdf; border-radius: 4px;
            overflow: hidden; cursor: pointer;
        }
        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover;
            filter: blur(0px);
            transition: filter 0.7s cubic-bezier(0.2, 1, 0.3, 1), transform 0.7s ease;
        }
        .gallery-item:hover img {
            filter: blur(15px);
            transform: scale(1.08);
        }
        .item-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.6s ease, backdrop-filter 0.6s ease; z-index: 2;
        }
        .gallery-item:hover .item-overlay { 
            opacity: 1; 
            backdrop-filter: blur(10px) saturate(140%); 
            -webkit-backdrop-filter: blur(10px) saturate(140%);
        }
        .item-text { 
            font-size: 14px; font-weight: 500; color: #000; letter-spacing: 0.2em; text-align: center;
            transform: translateY(10px); transition: transform 0.6s ease;
        }
        .gallery-item:hover .item-text { transform: translateY(0); }

        /* --- 5. L.A.B 섹션 --- */
        #labContent { 
            justify-content: flex-start; 
            align-items: flex-start; 
            padding: 0 20px; 
            gap: 30px; 
            flex-wrap: wrap; 
            max-width: 1400px; 
            margin-left: auto; 
            margin-right: auto; 
        }
        .post-it {
            position: relative; width: 280px; height: 280px; background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; transform: rotate(-1deg); cursor: pointer; transition: transform 0.3s ease;
        }
        .post-it:hover { transform: rotate(0deg) translateY(-5px) !important; }
        .post-it.empty { transform: rotate(2deg) !important; cursor: default; }
        .post-it.empty:hover { transform: rotate(0deg) translateY(-5px) !important; }
        .pin { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; background-color: #000; border-radius: 50%; }
        .lab-text { font-size: 13px; color: #000; line-height: 2; text-transform: none; }
        .question-mark { font-size: 40px; color: #ccc; font-weight: 300; }

        /* --- 6. Spice World & NEXT ALINEA 공통 리퀴드 스타일 --- */
        #spiceGallery, #nextAlineaContent { 
            display: none; flex-direction: row; justify-content: flex-start; align-items: flex-start;
            gap: 30px; padding: 0 50px; overflow-x: auto; 
            scrollbar-width: none; 
        }
        #spiceGallery::-webkit-scrollbar, #nextAlineaContent::-webkit-scrollbar { display: none; } 

        .spice-item, .next-experience-item { 
            flex: 0 0 auto; height: 350px; width: auto; 
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); padding: 15px; border-radius: 20px; cursor: pointer;
            transition: transform 0.3s ease;
        }
        .spice-item:hover, .next-experience-item:hover { transform: translateY(-5px); }
        .spice-item img, .next-experience-item img { height: 100%; width: auto; display: block; border-radius: 10px; }

        #imageLightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(242, 242, 242, 0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 10000; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.4s ease;
        }
        .lightbox-glass {
            position: relative; width: auto; max-width: 90%; max-height: 85%;
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.5); padding: 20px; border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center;
        }
        .lightbox-glass img { max-width: 100%; max-height: 75vh; border-radius: 15px; }
        .lightbox-close {
            position: absolute; top: 15px; right: 20px; font-size: 28px; font-weight: 300; color: #000;
            cursor: pointer; z-index: 10001; line-height: 1;
        }

        /* --- 7. WIP 정중앙 --- */
        #wipContent { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: 500; display: none; align-items: center; justify-content: center;
            margin-top: 0; 
            pointer-events: none;
        }
        .glass-pill { 
            padding: 18px 45px; border-radius: 50px; font-size: 14px; 
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(25px); 
            border: 1px solid rgba(255,255,255,0.5); display: inline-block; 
            pointer-events: auto;
        }
        
        footer { position: fixed; bottom: 30px; left: 0; width: 100%; font-size: 11px; text-align: center; z-index: 10; }
        footer a { color: #888; text-decoration: none; }

        @media (max-width: 768px) {
            body { padding: 20px; }
            header { height: 70px; top: 15px; left: 15px; right: 15px; padding: 0 25px; justify-content: space-between; }
            .menu-trigger { position: static; }
            .logo { font-size: 16px; letter-spacing: 0.4em; }
            .menu-text { display: none; }
            #sideMenu { width: 100%; padding-top: 120px; }
            .content-section { margin-top: 140px; }
            #wipContent { margin-top: 0; }
            #archiveContent { flex-direction: column; }
            .gallery-item { width: 100%; }
            #labContent { justify-content: center; } 
            .post-it { width: 100%; max-width: 300px; height: 300px; }
            .spice-item, .next-experience-item { height: 280px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-trigger" id="menuBtn">
            <div class="burger-icon"><span></span><span></span><span></span></div>
            <div class="menu-text">MENU</div>
        </div>
        <div class="logo" onclick="location.reload()">MORPH</div>
    </header>

    <div id="sideMenu">
        <div class="close-btn" id="closeBtn">CLOSE</div>
        <div class="menu-item" onclick="showSection('wipContent')">SEQUENCE 1.0</div>
        <div class="menu-item" onclick="showSection('labContent')">L.A.B</div>
        <div class="menu-item" onclick="showSection('archiveContent')">ARCHIVE</div>
    </div>

    <div id="mainContent" class="content-section" style="display: block; opacity: 1;">
        <div class="info">TAEHAN LEE<br>NEW YORK, US</div>
    </div>

    <div id="archiveContent" class="content-section">
        <div class="gallery-item" onclick="showSection('nextAlineaContent')">
            <img src="IMG_1673.jpg" alt="NEXT ALINEA">
            <div class="item-overlay">
                <span class="item-text">NEXT (ALINEA GROUP)</span>
            </div>
        </div>
        <div class="gallery-item">
            <div class="item-overlay" style="opacity: 1; background: rgba(0,0,0,0.03);">
                <span class="item-text">?</span>
            </div>
        </div>
    </div>

    <div id="nextAlineaContent" class="content-section">
        <div class="next-experience-item clickable-img"><img src="Star.jpg" alt="Star"></div>
        <div class="next-experience-item clickable-img"><img src="Kitchen.jpg" alt="Kitchen"></div>
        <div class="next-experience-item clickable-img"><img src="NEXT%20BLUE.jpg" alt="Next Blue"></div>
        <div class="next-experience-item clickable-img"><img src="NEXT%20Small%20Green.jpg" alt="Next Small Green"></div>
        <div class="next-experience-item clickable-img"><img src="NEXT%20Big%20Green.jpg" alt="Next Big Green"></div>
        <div class="next-experience-item clickable-img"><img src="NEXT%20Dessert.jpg" alt="Next Dessert"></div>
        <div class="next-experience-item clickable-img"><img src="Canelloni%20Production.jpg" alt="Canelloni Production"></div>
        <div class="next-experience-item clickable-img"><img src="Canelloni.jpg" alt="Canelloni"></div>
        <div class="next-experience-item clickable-img"><img src="Dining%20Room.jpg" alt="Dining Room"></div>
    </div>

    <div id="labContent" class="content-section">
        <div class="post-it" onclick="showSection('spiceGallery')">
            <div class="pin"></div>
            <div class="lab-text">MORPH LAB<br>X<br>SPICE WORLD<br>project.s</div>
        </div>
        <div class="post-it empty">
            <div class="pin"></div>
            <div class="question-mark">?</div>
        </div>
    </div>

    <div id="spiceGallery" class="content-section">
        <div class="spice-item clickable-img"><img src="IMG_2587.jpg" alt="Spice 1"></div>
        <div class="spice-item clickable-img"><img src="IMG_2631 2.jpg" alt="Spice 2"></div>
    </div>

    <div id="imageLightbox">
        <div class="lightbox-glass">
            <div class="lightbox-close" id="lightboxClose">✕</div>
            <img id="expandedImg" src="" alt="Expanded View">
        </div>
    </div>

    <div id="wipContent" class="content-section">
        <div class="glass-pill">WORK IN PROGRESS</div>
    </div>

    <footer><a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a></footer>

    <script>
        const sideMenu = document.getElementById('sideMenu');
        const lightbox = document.getElementById('imageLightbox');
        const expandedImg = document.getElementById('expandedImg');

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => {
                s.style.display = 'none';
                s.style.opacity = '0';
            });

            const target = document.getElementById(id);
            if (!target) return;

            const flexSections = ['archiveContent', 'labContent', 'spiceGallery', 'wipContent', 'nextAlineaContent'];
            
            if (flexSections.includes(id)) {
                target.style.display = 'flex';
            } else {
                target.style.display = 'block';
            }

            setTimeout(() => { target.style.opacity = '1'; }, 50);
            sideMenu.classList.remove('active');
        }

        document.addEventListener('click', function(e) {
            const item = e.target.closest('.clickable-img');
            if (item) {
                const img = item.querySelector('img');
                if (img) {
                    expandedImg.src = img.src;
                    lightbox.style.display = 'flex';
                    setTimeout(() => lightbox.style.opacity = '1', 10);
                }
            }
        });

        document.getElementById('lightboxClose').addEventListener('click', () => {
            lightbox.style.opacity = '0';
            setTimeout(() => { lightbox.style.display = 'none'; }, 400);
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) document.getElementById('lightboxClose').click();
        });

        document.getElementById('menuBtn').onclick = () => sideMenu.classList.add('active');
        document.getElementById('closeBtn').onclick = () => sideMenu.classList.remove('active');
    </script>
</body>
</html>
