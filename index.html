<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        /* 기본 설정: 화이트 톤 & 미니멀 */
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            -webkit-font-smoothing: antialiased;
        }

        /* 맨 위 블럭: 반투명 (Glassmorphism) */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.7); /* 반투명 화이트 */
            backdrop-filter: blur(10px); /* 뒤 배경 흐림 효과 */
            border-bottom: 0.5px solid #ececec;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        /* 중앙 미니멀 로고 */
        .logo {
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.4em;
        }

        /* 배너 섹션 (Navigation) */
        nav {
            margin-top: 120px;
            padding: 0 40px;
            display: flex;
            gap: 40px;
            font-size: 11px;
            font-family: "SF Mono", Menlo, monospace;
            color: #888;
        }

        nav a {
            text-decoration: none;
            color: inherit;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #000;
        }

        /* 프로젝트 리스트 스타일 */
        main {
            padding: 40px;
            margin-top: 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 0.5px solid #ececec;
            font-size: 13px;
            text-decoration: none;
            color: #000;
        }

        /* 푸터: 인스타그램 링크 */
        footer {
            padding: 80px 40px 40px 40px;
            font-family: "SF Mono", monospace;
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            color: #aaa;
        }

        footer a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid #000;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MORPH</div>
    </header>

    <nav>
        <a href="#">SEQUENCE 1.0</a>
        <a href="#">ARCHIVE</a>
    </nav>
