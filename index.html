<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden; /* 메뉴 슬라이드 시 가로 스크롤 방지 */
        }

        /* --- 1. 상단 리퀴드 글래스 헤더 --- */
        header {
            position: fixed;
            top: 25px; 
            left: 25px;
            right: 25px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001; /* 메뉴판보다 위에 있어야 버튼이 눌립니다 */
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        .menu-trigger {
            position: absolute;
            left: 40px;
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 15px;
            transition: opacity 0.3s;
        }

        .burger-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .burger-icon span {
            display: block;
            width: 25px;
            height: 2px;
        }
        .line-red { background-color: #ff0000; }
        .line-blue { background-color: #0000ff; }
        .line-black { background-color: #000000; }

        .menu-text {
            font-size: 14px;
            font-weight: 500;
        }

        .logo {
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.6em;
        }

        /* --- 2. 슬라이딩 메뉴판 (라이트 그레이) --- */
        #sideMenu {
            position: fixed;
            top: 0;
            left: -350px; /* 처음엔 왼쪽 밖으로 숨김 */
            width: 350px; 
            height: 100%;
            background-color: #f2f2f2; /* 라이트 그레이 */
            z-index: 10000;
            padding: 160px 50px; /* 헤더 아래에서 시작하도록 상단 여백 */
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0,0,0,0.02);
        }

        /* 메뉴 열렸을 때 (오른쪽으로 약 350px 이동) */
        #sideMenu.active {
            transform: translateX(350px);
        }

        .menu-item {
            display: block;
            font-size: 16px;
            text-decoration: none;
            color: #000;
            margin-bottom: 30px;
            transition: opacity 0.3s;
        }
        .menu-item::after { content: " →"; }
        .menu-item:hover { opacity: 0.4; }

        /* 메뉴 닫기 버튼 */
        .close-area {
            font-size: 11px;
            color: #999;
            cursor: pointer;
            margin-top: auto; /* 맨 아래로 보냄 */
            padding-bottom: 50px;
        }

        /* --- 3. 기본 컨텐츠 --- */
        .info {
            font-size: 14px;
            line-height: 1.6;
            margin-top: 150px;
            margin-bottom: 35px;
        }

        footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            text-align: center;
        }

        footer a {
            color: #ccc;
            text-decoration: none;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-trigger" onclick="toggleMenu()">
            <div class="burger-icon">
                <span class="line-red"></span>
                <span class="line-blue"></span>
                <span class="line-black"></span>
            </div>
            <div class="menu-text">MENU</div>
        </div>
        <div class="logo">MORPH</div>
    </header>

    <div id="sideMenu">
        <a href="#" class="menu-item">SEQUENCE 1.0</a>
        <a href="#" class="menu-item">ARCHIVE</a>
        <div class="close-area" onclick="toggleMenu()">CLOSE MENU —</div>
    </div>

    <div class="info">
        TAEHAN LEE<br>
        NEW YORK, US
    </div>

    <footer>
        <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
    </footer>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.classList.toggle('active');
        }
    </script>

</body>
</html>
