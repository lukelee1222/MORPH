<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
        }

        /* --- 1. Liquid Glass Header --- */
        header {
            position: fixed;
            top: 25px; 
            left: 25px;
            right: 25px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999; 
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        /* Menu Trigger: Both Icon and Text are clickable */
        .menu-trigger {
            position: absolute;
            left: 40px;
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 15px;
            padding: 15px; /* Wider click area */
            transition: opacity 0.3s;
        }
        .menu-trigger:hover {
            opacity: 0.5;
        }

        /* All-Black Burger Icon */
        .burger-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .burger-icon span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: #000000; /* All lines changed to Black */
        }

        .logo {
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.6em;
        }

        /* --- 2. Sliding Side Menu --- */
        #sideMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px; 
            height: 100vh;
            background-color: #f2f2f2; 
            z-index: 10000; 
            padding: 150px 40px 40px 40px;
            transform: translateX(-100%); 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0,0,0,0.05);
        }

        #sideMenu.active {
            transform: translateX(0);
        }

        .menu-item {
            display: block;
            font-size: 14px;
            text-decoration: none;
            color: #000;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .menu-item::after { content: " →"; }

        .close-btn {
            margin-top: auto;
            font-size: 11px;
            color: #888;
            cursor: pointer;
            padding: 10px 0;
        }

        /* --- 3. Content & Technical Graphic --- */
        .info {
            font-size: 14px;
            line-height: 1.6;
            margin-top: 150px;
        }

        .tech-graphic {
            position: fixed;
            bottom: 40px; 
            right: 40px;  
            width: 400px; 
            z-index: 50;  
            opacity: 0.8; 
            pointer-events: none; 
        }

        .tech-graphic img {
            width: 100%;
            height: auto;
            mix-blend-mode: multiply; 
        }

        footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
        }
        footer a { color: #ccc; text-decoration: none; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <header>
        <div class="menu-trigger" id="menuBtn">
            <div class="burger-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div style="font-size:14px; font-weight:500;">MENU</div>
        </div>
        <div class="logo">MORPH</div>
    </header>

    <div id="sideMenu">
        <a href="#" class="menu-item">SEQUENCE 1.0</a>
        <a href="#" class="menu-item">ARCHIVE</a>
        <div class="close-btn" id="closeBtn">✕ CLOSE</div>
    </div>

    <div class="info">
        TAEHAN LEE<br>
        NEW YORK, US
    </div>

    <div class="tech-graphic">
        <img src="IMG_2821.jpg" alt="MORPH Technical Draft">
    </div>

    <footer>
        <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('menuBtn');
            const closeBtn = document.getElementById('closeBtn');
            const sideMenu = document.getElementById('sideMenu');

            // Opens menu when clicking ANYWHERE inside the menu-trigger (icon or text)
            menuBtn.addEventListener('click', () => {
                sideMenu.classList.add('active');
            });

            closeBtn.addEventListener('click', () => {
                sideMenu.classList.remove('active');
            });
        });
    </script>

</body>
</html>
