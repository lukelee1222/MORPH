<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 30px;
            letter-spacing: 0.02em;
            min-height: 200vh; /* 효과 확인을 위한 높이 */
        }

        /* 1. 상단 전체를 덮는 리퀴드 글래스 헤더 */
        header {
            position: fixed;
            top: 20px; /* 살짝 띄워서 물방울 질감 강조 */
            left: 20px;
            right: 20px; /* 양옆으로 길게 확장 */
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            border-radius: 20px; /* 기존 곡률 유지 */
            
            /* 리퀴드 질감 최적화 */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        .logo {
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.6em;
            color: #000;
        }

        /* 2. 인포 섹션 (수정: NEW YORK, US) */
        .info {
            font-size: 11px;
            line-height: 1.5;
            margin-top: 120px; /* 헤더가 커진 만큼 여백 확보 */
            margin-bottom: 25px;
            font-weight: 400;
        }

        /* 3. 메뉴 (Sequence / Archive) */
        nav {
            margin-bottom: 60px;
        }

        nav a {
            display: block;
            font-size: 11px;
            text-decoration: none;
            color: #000;
            margin-bottom: 6px;
            transition: opacity 0.3s;
        }

        nav a::after {
            content: " →";
        }

        nav a:hover {
            opacity: 0.4;
        }

        /* 4. 작업물 리스트 (요청에 따라 비워둠) */
        main {
            border-top: 0.5px solid #f0f0f0;
            padding-top: 20px;
        }

        /* 5. 푸터 (수정: 하단 중앙 정렬) */
        footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%); /* 정확히 가운데 정렬 */
            font-size: 10px;
            width: 100%;
            text-align: center;
        }

        footer a {
            color: #ccc;
            text-decoration: none;
            transition: color 0.3s;
            border-bottom: 1px solid #eee;
            padding-bottom: 2px;
        }

        footer a:hover {
            color: #000;
            border-bottom-color: #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MORPH</div>
    </header>

    <div class="info">
        TAEHAN LEE<br>
        NEW YORK, US
    </div>

    <nav>
        <a href="#">SEQUENCE 1.0</a>
        <a href="#">ARCHIVE</a>
    </nav>

    <main>
        </main>

    <footer>
        <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
    </footer>

</body>
</html>
