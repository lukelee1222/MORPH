<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        /* 1. 기본 셋팅: PAF 특유의 차갑고 정제된 화이트 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 30px;
            letter-spacing: 0.02em;
        }

        /* 2. 중앙 리퀴드 글래스 로고 (태한 님 최애 스타일) */
        header {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        .logo {
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.6em;
            color: #000;
        }

        /* 3. 왼쪽 상단: 인포 섹션 (PAF 스타일) */
        .info {
            font-size: 11px;
            line-height: 1.5;
            margin-top: 100px;
            margin-bottom: 25px;
            font-weight: 400;
        }

        /* 4. SHOP 위치의 메뉴: Sequence & Archive */
        nav {
            margin-bottom: 80px;
        }

        nav a {
            display: block;
            font-size: 11px;
            text-decoration: none;
            color: #000;
            margin-bottom: 6px;
            transition: opacity 0.3s;
        }

        nav a::after {
            content: " →";
        }

        nav a:hover {
            opacity: 0.4;
        }

        /* 5. 메인 리스트 및 이미지 공간 */
        main {
            border-top: 1px solid #f0f0f0;
            padding-top: 20px;
        }

        .list-item {
            font-size: 11px;
            margin-bottom: 5px;
            color: #000;
        }

        /* 푸터: 인스타그램 */
        footer {
            position: fixed;
            bottom: 30px;
            left: 30px;
            font-size: 10px;
        }

        footer a {
            color: #ccc;
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MORPH</div>
    </header>

    <div class="info">
        TAEHAN LEE<br>
        MORPH L.A.B<br>
        2026 ARCHIVE<br>
        SEOUL, KR
    </div>

    <nav>
        <a href="#">SEQUENCE 1.0</a>
        <a href="#">ARCHIVE</a>
    </nav>

    <main>
        <div class="list-item">001 PRE-MUTATION (GASTRONOMY)</div>
        <div class="list-item">002 STRUCTURAL ANALYSIS</div>
        <div class="list-item">003 BOUNDARY RECONSTRUCTION</div>
        
        <div style="height: 1000px;"></div>
    </main>

    <footer>
        <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
    </footer>

</body>
</html>
