<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px; /* 여백을 조금 더 넓혔습니다 */
            letter-spacing: 0.05em; /* 자간을 살짝 넓혀 가독성 확보 */
            min-height: 200vh;
        }

        /* 1. 상단 전체 리퀴드 글래스 헤더 (로고 크기 상향) */
        header {
            position: fixed;
            top: 25px; 
            left: 25px;
            right: 25px;
            height: 90px; /* 높이를 조금 더 키웠습니다 */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        .logo {
            font-weight: 500;
            font-size: 22px; /* 16px -> 22px 상향 */
            letter-spacing: 0.6em;
            color: #000;
        }

        /* 2. 인포 섹션 (폰트 크기 상향) */
        .info {
            font-size: 14px; /* 11px -> 14px 상향 */
            line-height: 1.6;
            margin-top: 140px; 
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* 3. 메뉴 (Sequence / Archive 폰트 크기 상향) */
        nav {
            margin-bottom: 80px;
        }

        nav a {
            display: block;
            font-size: 14px; /* 11px -> 14px 상향 */
            text-decoration: none;
            color: #000;
            margin-bottom: 10px; /* 간격도 넓혔습니다 */
            transition: opacity 0.3s;
        }

        nav a::after {
            content: " →";
        }

        nav a:hover {
            opacity: 0.4;
        }

        /* 4. 작업물 리스트 영역 */
        main {
            border-top: 0.5px solid #f0f0f0;
            padding-top: 30px;
        }

        /* 5. 푸터 (인스타그램 폰트 크기 상향) */
        footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px; /* 10px -> 13px 상향 */
            width: 100%;
            text-align: center;
        }

        footer a {
            color: #888; /* 살짝 연하게 변경해 세련미 추가 */
            text-decoration: none;
            transition: color 0.3s;
            border-bottom: 1px solid #eee;
            padding-bottom: 2px;
        }

        footer a:hover {
            color: #000;
            border-bottom-color: #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MORPH</div>
    </header>

    <div class="info">
        TAEHAN LEE<br>
        NEW YORK, US
    </div>

    <nav>
        <a href="#">SEQUENCE 1.0</a>
        <a href="#">ARCHIVE</a>
    </nav>

    <main>
        </main>

    <footer>
        <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
    </footer>

</body>
</html>
