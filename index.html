<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            min-height: 200vh;
        }

        /* --- 1. 상단 리퀴드 글래스 헤더 --- */
        header {
            position: fixed;
            top: 25px; 
            left: 25px;
            right: 25px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        /* 메뉴 트리거 커스텀 (삼색 아이콘 + MENU) */
        .menu-trigger {
            position: absolute;
            left: 40px;
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 15px;
            transition: opacity 0.3s;
        }
        .menu-trigger:hover { opacity: 0.5; }

        .burger-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .burger-icon span {
            display: block;
            width: 25px;
            height: 2px;
        }
        .line-red { background-color: #ff0000; }
        .line-blue { background-color: #0000ff; }
        .line-black { background-color: #000000; }

        .menu-text {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1em;
        }

        .logo {
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.6em;
            color: #000;
        }

        /* --- 2. 슬라이딩 메뉴판 (라이트 그레이) --- */
        .side-menu {
            position: fixed;
            top: 0;
            left: -100%; /* 완전히 숨김 */
            width: 350px; 
            height: 100%;
            background-color: #f2f2f2; /* 라이트 그레이 */
            z-index: 10000;
            padding: 140px 50px;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 15px 0 40px rgba(0,0,0,0.03);
        }

        .side-menu.active {
            transform: translateX(100%); /* 왼쪽에서 나타남 */
        }

        .side-menu a {
            display: block;
            font-size: 18px;
            text-decoration: none;
            color: #000;
            margin-bottom: 30px;
            transition: opacity 0.3s;
        }
        .side-menu a::after { content: " →"; }
        .side-menu a:hover { opacity: 0.4; }

        .close-btn {
            position: absolute;
            top: 55px;
            right: 40px;
            font-size: 13px;
            cursor: pointer;
            color: #999;
        }

        /* --- 3. 기본 컨텐츠 --- */
        .info {
            font-size: 14px;
            line-height: 1.6;
            margin-top: 150px;
            margin-bottom: 35px;
        }

        footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            width: 100%;
            text-align: center;
        }

        footer a {
            color: #888;
            text-decoration: none;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-trigger" onclick="toggleMenu()">
            <div class="burger-icon">
                <span class="line-red"></span>
                <span class="line-blue"></span>
                <span class="line-black"></span>
            </div>
            <div class="menu-text">MENU</div>
        </div>
        <div class="logo">MORPH</div>
    </header>

    <div id="sideMenu" class="side-menu">
        <div class="close-btn" onclick="toggleMenu()">CLOSE</div>
        <a href="#">SEQUENCE 1.0</a>
        <a href="#">ARCHIVE</a>
    </div>

    <div class="info">
        TAEHAN LEE<br>
        NEW YORK, US
    </div>

    <footer>
        <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
    </footer>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.classList.toggle('active');
        }
    </script>

</body>
</html>
