<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            -webkit-font-smoothing: antialiased;
            /* 스크롤이 가능해야 유리 효과를 확인할 수 있습니다 */
            min-height: 200vh; 
        }

        /* --- 물방울 Liquid Glass 헤더 --- */
        header {
            position: fixed;
            top: 25px; 
            left: 50%;
            transform: translateX(-50%); /* 정확히 중앙 정렬 */
            width: 90%;
            max-width: 1200px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border-radius: 100px; /* 더 둥글게 해서 물방울 느낌 극대화 */

            /* 투명도와 블러 최적화 */
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            
            /* 유리 질감을 만드는 핵심: 맺혀있는 듯한 테두리와 그림자 */
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03), 
                        inset 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .logo {
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 0.7em;
            color: rgba(0, 0, 0, 0.9);
        }

        /* --- 배너 & 컨텐츠 --- */
        nav {
            margin-top: 180px;
            padding: 0 50px;
            display: flex;
            gap: 40px;
        }

        nav a {
            text-decoration: none;
            color: #bbbbbb;
            font-size: 10px;
            font-family: "SF Mono", monospace;
            transition: 0.3s;
        }

        nav a:hover { color: #000; }

        main {
            padding: 50px;
            text-align: center;
        }

        /* 불필요한 검정 박스 대신 실제 사진이 들어갈 자리 가이드 */
        .image-placeholder {
            width: 100%;
            max-width: 1000px;
            height: 600px;
            margin: 40px auto;
            background: #f9f9f9; /* 아주 연한 회색으로 변경 */
            border: 0.5px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ddd;
            font-size: 11px;
        }

        footer {
            padding: 100px 50px;
            font-family: "SF Mono", monospace;
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            color: #999;
        }

        footer a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MORPH</div>
    </header>

    <nav>
        <a href="#">SEQUENCE 1.0</a>
        <a href="#">ARCHIVE</a>
    </nav>

    <main>
        <div class="image-placeholder">PROJECT_IMAGE_01_HERE</div>
        <div class="image-placeholder">PROJECT_IMAGE_02_HERE</div>
    </main>

    <footer>
        <div>DESIGN BY TAEHAN LEE</div>
        <div>
            <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
        </div>
    </footer>

</body>
</html>
