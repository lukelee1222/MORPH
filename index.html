<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
        }

        /* --- 1. 상단 리퀴드 글래스 헤더 --- */
        header {
            position: fixed;
            top: 25px; 
            left: 25px;
            right: 25px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999; /* 무조건 맨 위에 오도록 수치 극대화 */
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        /* 메뉴 트리거 (삼색 아이콘 + MENU) */
        .menu-trigger {
            position: absolute;
            left: 40px;
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 15px;
            padding: 10px; /* 클릭 영역 확보 */
        }

        .burger-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .burger-icon span {
            display: block;
            width: 25px;
            height: 2px;
        }
        .line-red { background-color: #ff0000; }
        .line-blue { background-color: #0000ff; }
        .line-black { background-color: #000000; }

        .logo {
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.6em;
        }

        /* --- 2. 슬라이딩 메뉴판 (라이트 그레이) --- */
        #sideMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px; /* 태한님이 말씀하신 약 3cm 정도의 슬림한 폭 */
            height: 100vh;
            background-color: #e8e8e8; /* 확실한 라이트 그레이 */
            z-index: 10000; /* 헤더보다 아래에서 나타남 */
            padding: 150px 40px 40px 40px;
            
            /* 핵심: 화면 왼쪽 밖으로 100% 밀어둠 */
            transform: translateX(-100%); 
            /* 부드럽고 쫀득한 슬라이딩 애니메이션 */
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0,0,0,0.05);
        }

        /* JS가 'active' 클래스를 붙이면 원래 자리(0)로 슥 밀려옴 */
        #sideMenu.active {
            transform: translateX(0);
        }

        .menu-item {
            display: block;
            font-size: 14px;
            text-decoration: none;
            color: #000;
            margin-bottom: 25px;
            font-weight: 500;
            transition: opacity 0.3s;
        }
        .menu-item::after { content: " →"; }
        .menu-item:hover { opacity: 0.4; }

        .close-btn {
            margin-top: auto;
            font-size: 11px;
            color: #888;
            cursor: pointer;
            padding: 10px 0;
        }

        /* --- 3. 배경 컨텐츠 --- */
        .info {
            font-size: 14px;
            line-height: 1.6;
            margin-top: 150px;
        }

        footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
        }
        footer a { color: #ccc; text-decoration: none; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <header>
        <div class="menu-trigger" id="menuBtn">
            <div class="burger-icon">
                <span class="line-red"></span>
                <span class="line-blue"></span>
                <span class="line-black"></span>
            </div>
            <div style="font-size:14px; font-weight:500;">MENU</div>
        </div>
        <div class="logo">MORPH</div>
    </header>

    <div id="sideMenu">
        <a href="#" class="menu-item">SEQUENCE 1.0</a>
        <a href="#" class="menu-item">ARCHIVE</a>
        <div class="close-btn" id="closeBtn">✕ CLOSE</div>
    </div>

    <div class="info">
        TAEHAN LEE<br>
        NEW YORK, US
    </div>

    <footer>
        <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('menuBtn');
            const closeBtn = document.getElementById('closeBtn');
            const sideMenu = document.getElementById('sideMenu');

            // 메뉴 버튼을 누르면 'active' 클래스 추가 (열림)
            menuBtn.addEventListener('click', () => {
                sideMenu.classList.add('active');
            });

            // 닫기 버튼을 누르면 'active' 클래스 제거 (닫힘)
            closeBtn.addEventListener('click', () => {
                sideMenu.classList.remove('active');
            });
        });
    </script>

</body>
</html>
