<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
        }

        /* --- 1. Liquid Glass Header --- */
        header {
            position: fixed;
            top: 25px; 
            left: 25px;
            right: 25px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Header z-index: 10 */
            z-index: 10; 
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        /* Menu Trigger Button */
        .menu-trigger {
            position: absolute;
            left: 40px;
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 15px;
            padding: 15px; 
            z-index: 20;
        }

        .menu-trigger:hover {
            opacity: 0.5;
        }

        /* All-Black Burger Icon */
        .burger-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .burger-icon span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: #000000 !important; 
        }

        .logo {
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.6em;
            color: #000000;
        }

        /* --- 2. Sliding Side Menu --- */
        #sideMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px; 
            height: 100vh;
            background-color: #f2f2f2; 
            /* Menu z-index: 9999 (Covers Header) */
            z-index: 9999; 
            padding: 150px 40px 40px 40px;
            transform: translateX(-100%); 
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0,0,0,0.05);
        }

        #sideMenu.active {
            transform: translateX(0);
        }

        .menu-item {
            display: block;
            font-size: 14px;
            text-decoration: none;
            color: #000;
            margin-bottom: 25px;
            font-weight: 500;
