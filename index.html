<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            min-height: 200vh;
        }

        /* --- 1. 상단 리퀴드 글래스 헤더 --- */
        header {
            position: fixed;
            top: 25px; 
            left: 25px;
            right: 25px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center; /* 로고는 여전히 중앙 */
            z-index: 9999;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        /* 헤더 왼쪽 끝 MENU 버튼 */
        .menu-trigger {
            position: absolute;
            left: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.2em;
            transition: opacity 0.3s;
        }
        .menu-trigger:hover { opacity: 0.5; }

        .logo {
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.6em;
            color: #000;
        }

        /* --- 2. 슬라이딩 메뉴판 (라이트 그레이) --- */
        .side-menu {
            position: fixed;
            top: 0;
            left: -320px; /* 처음엔 숨겨둠 */
            width: 300px; /* 메뉴 폭 */
            height: 100%;
            background-color: #f5f5f5; /* 라이트 그레이 */
            z-index: 10000;
            padding: 140px 40px;
            transition: left 0.5s cubic-bezier(0.16, 1, 0.3, 1); /* 부드러운 슬라이딩 */
            box-shadow: 10px 0 30px rgba(0,0,0,0.02);
        }

        /* 메뉴 활성화 시 */
        .side-menu.active {
            left: 0; /* 3cm(약 110px) 이상 충분히 나오도록 설정 */
        }

        .side-menu a {
            display: block;
            font-size: 16px;
            text-decoration: none;
            color: #000;
            margin-bottom: 25px;
            transition: opacity 0.3s;
        }
        .side-menu a::after { content: " →"; }
        .side-menu a:hover { opacity: 0.4; }

        /* 메뉴 닫기 버튼 */
        .close-btn {
            position: absolute;
            top: 50px;
            right: 40px;
            font-size: 12px;
            cursor: pointer;
            color: #999;
        }

        /* --- 3. 배경 컨텐츠 --- */
        .info {
            font-size: 14px;
            line-height: 1.6;
            margin-top: 140px;
            margin-bottom: 35px;
        }

        main {
            border-top: 0.5px solid #f0f0f0;
            padding-top: 30px;
        }

        footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            text-align: center;
        }

        footer a {
            color: #888;
            text-decoration: none;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-trigger" onclick="toggleMenu()">MENU</div>
        <div class="logo">MORPH</div>
    </header>

    <div id="sideMenu" class="side-menu">
        <div class="close-btn" onclick="toggleMenu()">CLOSE</div>
        <a href="#">SEQUENCE 1.0</a>
        <a href="#">ARCHIVE</a>
    </div>

    <div class="info">
        TAEHAN LEE<br>
        NEW YORK, US
    </div>

    <main>
        </main>

    <footer>
        <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
    </footer>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.classList.toggle('active');
        }
    </script>

</body>
</html>
