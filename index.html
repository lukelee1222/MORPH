<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOALAM / ARCHIVE</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            font-family: "SF Mono", "Menlo", monospace;
            font-size: 11px;
            color: #888;
            margin-bottom: 60px;
        }
        .item {
            display: grid;
            grid-template-columns: 100px 1fr 100px;
            padding: 20px 0;
            border-bottom: 1px solid #1a1a1a;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }
        .item:hover {
            color: #888;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div>HOALAM_ARCHIVE</div>
        <div>V.01-2026</div>
    </header>
    <a href="#" class="item">
        <span>001</span>
        <span>Visual Identity Project</span>
        <span style="text-align:right;">2024</span>
    </a>
    <a href="#" class="item">
        <span>002</span>
        <span>Digital Interface Study</span>
        <span style="text-align:right;">2023</span>
    </a>
</body>
</html>
