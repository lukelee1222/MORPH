<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH - L.A.B</title>
    <style>
        /* 기본 스타일 초기화 */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f9f9f9;
        }

        /* 헤더 부분 (기존 디자인 유지) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-size: 24px;
            letter-spacing: 8px;
            font-weight: bold;
        }

        /* 메인 컨텐츠 영역 */
        .main-content {
            padding: 40px;
        }

        /* 1. 상단 사각형 2개 레이아웃 */
        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2열 배치 */
            gap: 20px;
            margin-bottom: 50px;
        }

        .image-box {
            background-color: #e0e0e0;
            aspect-ratio: 16 / 9; /* 사각형 비율 유지 */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 2. L.A.B 포스트잇 영역 (왼쪽 상단 배치) */
        .lab-section {
            display: flex;
            justify-content: flex-start; /* 왼쪽 정렬 */
            align-items: flex-start;    /* 상단 정렬 */
            gap: 20px;                 /* 포스트잇 사이 간격 */
            margin-top: 30px;
        }

        /* 포스트잇 기본 디자인 */
        .post-it {
            width: 200px;
            height: 200px;
            background-color: #ffffff; /* 흰색 빈 포스트잇 느낌 */
            box-shadow: 3px 3px 10px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            position: relative;
        }

        /* 3. 물음표 포스트잇 스타일 */
        .post-it.question-mark {
            font-size: 40px;
            color: #ccc;
            font-weight: 300;
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-btn">☰ MENU</div>
        <div class="logo">M O R P H</div>
        <div class="empty"></div>
    </header>

    <main class="main-content">
        <div class="image-grid">
            <div class="image-box">
                <img src="your-image-1.jpg" alt="준비중">
            </div>
            <div class="image-box">
                <img src="your-image-2.jpg" alt="준비중">
            </div>
        </div>

        <div class="lab-section">
            <div class="post-it">
                <p>기존 작업물 또는 내용</p>
            </div>

            <div class="post-it question-mark">
                ?
            </div>
        </div>
    </main>

    <footer>
        INSTAGRAM @MORPH_L.A.B
    </footer>

</body>
</html>
