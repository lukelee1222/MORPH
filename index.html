<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #f2f2f2; 
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
            transition: background-color 0.6s ease;
        }

        /* --- 1. 고정 헤더 (리퀴드 글래스) --- */
        header {
            position: fixed; top: 25px; left: 25px; right: 25px; height: 90px;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; border-radius: 50px; 
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        
        .menu-trigger { position: absolute; left: 50px; display: flex; align-items: center; cursor: pointer; gap: 15px; }
        .burger-icon { display: flex; flex-direction: column; gap: 5px; }
        .burger-icon span { display: block; width: 25px; height: 2px; background-color: #000000; }
        .menu-text { font-size: 14px; font-weight: 500; }
        .logo { font-weight: 500; font-size: 22px; letter-spacing: 0.6em; color: #000000; text-decoration: none; cursor: pointer; }

        /* --- 2. 사이드 메뉴 --- */
        #sideMenu {
            position: fixed; top: 0; left: 0; width: 320px; height: 100vh;
            background-color: #e8e8e8; z-index: 9999; padding: 150px 50px 50px 50px;
            transform: translateX(-100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; 
            box-shadow: 20px 0 50px rgba(0,0,0,0.03);
        }
        #sideMenu.active { transform: translateX(0); }
        .menu-item { display: block; font-size: 16px; text-decoration: none; color: #000; margin-bottom: 30px; font-weight: 400; cursor: pointer; }
        .menu-item::after { content: " →"; }
        .close-btn { position: absolute; top: 55px; right: 40px; font-size: 13px; cursor: pointer; color: #999; }

        /* --- 3. 섹션 공통 스타일 --- */
        .content-section { 
            margin-top: 150px; 
            display: none; 
            opacity: 0; 
            transition: opacity 0.5s ease; 
        }

        /* --- 4. Archive 갤러리 --- */
        #archiveContent {
            justify-content: flex-start; gap: 20px; padding: 0 20px;
            max-width: 1400px; margin-left: auto; margin-right: auto;
        }
        .gallery-item {
            position: relative; flex: 1; aspect-ratio: 16 / 10;
            background-color: #dfdfdf; border-radius: 4px;
            overflow: hidden; cursor: pointer;
        }
        .item-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(15px) saturate(160%); -webkit-backdrop-filter: blur(15px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.5s ease; z-index: 2;
        }
        .gallery-item:hover .item-overlay { opacity: 1; }
        .item-text { font-size: 14px; font-weight: 400; color: #000; letter-spacing: 0.15em; text-align: center; }

        /* --- 5. L.A.B 섹션 --- */
        #labContent { justify-content: flex-start; align-items: flex-start; padding: 0 50px; gap: 30px; flex-wrap: wrap; }
        .post-it {
            position: relative; width: 280px; height: 280px; background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; transform: rotate(-1deg); cursor: pointer; transition: transform 0.3s ease;
        }
        .post-it:hover { transform: rotate(0deg) translateY(-5px); }
        .pin { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; background-color: #000; border-radius: 50%; }
        .lab-text { font-size: 13px; color: #000; line-height: 2; text-transform: none; }

        /* --- 6. L.A.B 상세 갤러리 --- */
        #spiceGallery { 
            display: none; flex-direction: row; justify-content: flex-start; align-items: flex-start;
            gap: 30px; padding: 0 50px; overflow-x: auto; 
        }
        .spice-item { 
            flex: 0 0 auto; height: 280px; width: auto; 
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); padding: 15px; border-radius: 20px; cursor: pointer;
        }
        .spice-item img { height: 100%; width: auto; display: block; border-radius: 10px; }

        /* --- 7. WIP 가로/세로 전체 정중앙 수정 --- */
        #wipContent { 
            position: fixed; /* 고정 위치 */
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            margin-top: 0; /* 마진 초기화 */
            z-index: 500; /* 헤더보다는 아래, 콘텐츠보다는 위 */
            display: none; 
            align-items: center; /* 세로 중앙 */
            justify-content: center; /* 가로 중앙 */
            pointer-events: none; /* 배경 클릭 방해 방지 */
        }
        .glass-pill { 
            padding: 18px 45px; border-radius: 50px; font-size: 14px; 
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(25px); 
            border: 1px solid rgba(255,255,255,0.5); 
            display: inline-block; 
            pointer-events: auto; /* 알약 자체는 마우스 이벤트 허용 */
        }
        
        footer { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 13px; width: 100%; text-align: center; z-index: 10; }
        footer a { color: #888; text-decoration: none; }

        @media (max-width: 768px) {
            header { height: 70px; top: 15px; left: 15px; right: 15px; }
            #archiveContent { flex-direction: column; }
            .gallery-item { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-trigger" id="menuBtn">
            <div class="burger-icon"><span></span><span></span><span></span></div>
            <div class="menu-text">MENU</div>
        </div>
        <div class="logo" onclick="location.reload()">MORPH</div>
    </header>

    <div id="sideMenu">
        <div class="close-btn" id="closeBtn">CLOSE</div>
        <div class="menu-item" onclick="showSection('wipContent')">SEQUENCE 1.0</div>
        <div class="menu-item" onclick="showSection('labContent')">L.A.B</div>
        <div class="menu-item" onclick="showSection('archiveContent')">ARCHIVE</div>
    </div>

    <div id="mainContent" class="content-section" style="display: block; opacity: 1;">
        <div class="info">TAEHAN LEE<br>NEW YORK, US</div>
    </div>

    <div id="archiveContent" class="content-section">
        <div class="gallery-item">
            <div class="item-overlay"><span class="item-text">NEXT (ALINEA GROUP)</span></div>
        </div>
        <div class="gallery-item">
            <div class="item-overlay"><span class="item-text">?</span></div>
        </div>
    </div>

    <div id="labContent" class="content-section">
        <div class="post-it" onclick="showSection('spiceGallery')">
            <div class="pin"></div>
            <div class="lab-text">MORPH LAB<br>X<br>SPICE WORLD<br>project.s</div>
        </div>
    </div>

    <div id="spiceGallery" class="content-section">
        <div class="spice-item"><img src="IMG_2587.jpg" alt="Spice 1"></div>
        <div class="spice-item"><img src="IMG_2631 2.jpg" alt="Spice 2"></div>
    </div>

    <div id="wipContent" class="content-section">
        <div class="glass-pill">WORK IN PROGRESS</div>
    </div>

    <footer><a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a></footer>

    <script>
        const sideMenu = document.getElementById('sideMenu');

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => {
                s.style.display = 'none';
                s.style.opacity = '0';
            });

            const target = document.getElementById(id);
            if (!target) return;

            // 정중앙 정렬이 필요한 섹션(WIP 포함) 처리
            if (id === 'archiveContent' || id === 'labContent' || id === 'spiceGallery' || id === 'wipContent') {
                target.style.display = 'flex';
            } else {
                target.style.display = 'block';
            }

            setTimeout(() => { target.style.opacity = '1'; }, 50);
            sideMenu.classList.remove('active');
        }

        document.getElementById('menuBtn').onclick = () => sideMenu.classList.add('active');
        document.getElementById('closeBtn').onclick = () => sideMenu.classList.remove('active');
    </script>
</body>
</html>
