<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
        }

        /* --- 1. 상단 리퀴드 글래스 헤더 --- */
        header {
            position: fixed;
            top: 25px; 
            left: 25px;
            right: 25px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001; /* 메뉴판(10000)보다 높게 설정 */
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        .menu-trigger {
            position: absolute;
            left: 40px;
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 15px;
        }

        .burger-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .burger-icon span {
            display: block;
            width: 25px;
            height: 2px;
        }
        .line-red { background-color: #ff0000; }
        .line-blue { background-color: #0000ff; }
        .line-black { background-color: #000000; }

        .logo {
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.6em;
        }

        /* --- 2. 릭 오웬스 스타일 슬라이딩 메뉴판 --- */
        #sideMenu {
            position: fixed;
            top: 0;
            left: -320px; /* 처음엔 완전히 숨김 */
            width: 320px; /* 메뉴판 너비 */
            height: 100%;
            background-color: #f2f2f2; /* 요청하신 라이트 그레이 */
            z-index: 10000;
            padding: 160px 40px 40px 40px;
            transition: left 0.5s cubic-bezier(0.16, 1, 0.3, 1); /* 부드러운 슬라이딩 */
            display: flex;
            flex-direction: column;
        }

        /* 메뉴 열기 상태: 왼쪽 끝을 0에 맞춤 */
        #sideMenu.active {
            left: 0;
        }

        .menu-item {
            display: block;
            font-size: 14px;
            text-decoration: none;
            color: #000;
            margin-bottom: 25px;
            font-weight: 400;
            transition: opacity 0.3s;
        }
        .menu-item:hover { opacity: 0.4; }

        .close-btn {
            margin-top: auto;
            font-size: 11px;
            color: #999;
            cursor: pointer;
            padding-bottom: 20px;
        }

        /* --- 3. 배경 레이아웃 --- */
        .info {
            font-size: 14px;
            line-height: 1.6;
            margin-top: 150px;
        }

        footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
        }
        footer a { color: #ccc; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <div class="menu-trigger" onclick="openMenu()">
            <div class="burger-icon">
                <span class="line-red"></span>
                <span class="line-blue"></span>
                <span class="line-black"></span>
            </div>
            <div style="font-size:14px; font-weight:500;">MENU</div>
        </div>
        <div class="logo">MORPH</div>
    </header>

    <div id="sideMenu">
        <a href="#" class="menu-item">SEQUENCE 1.0</a>
        <a href="#" class="menu-item">ARCHIVE</a>
        <div class="close-btn" onclick="closeMenu()">✕ CLOSE</div>
    </div>

    <div class="info">
        TAEHAN LEE<br>
        NEW YORK, US
    </div>

    <footer>
        <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
    </footer>

    <script>
        function openMenu() {
            document.getElementById('sideMenu').classList.add('active');
        }
        function closeMenu() {
            document.getElementById('sideMenu').classList.remove('active');
        }
    </script>

</body>
</html>
