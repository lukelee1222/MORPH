<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            -webkit-font-smoothing: antialiased;
            /* 스크롤을 만들어 효과를 확인하기 위함 */
            min-height: 200vh; 
        }

        /* --- 아이폰 리퀴드 글래스 헤더 --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;

            /* 투명도를 낮추고 블러를 아주 강하게 (40px) */
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            
            /* 유리 두께감을 주는 미세한 선 */
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-weight: 500;
            font-size: 18px;
            letter-spacing: 0.5em;
            color: #000;
        }

        /* --- 컨텐츠 영역 --- */
        nav {
            margin-top: 140px;
            padding: 0 40px;
            display: flex;
            gap: 40px;
        }

        nav a {
            text-decoration: none;
            color: #888;
            font-size: 11px;
            font-family: "SF Mono", monospace;
        }

        main {
            padding: 40px;
        }

        /* 유리 효과를 확인하기 위한 컬러 박스들 */
        .test-box {
            width: 100%;
            height: 300px;
            margin-top: 40px;
            background: linear-gradient(135deg, #f0f0f0 0%, #dcdcdc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #aaa;
        }

        footer {
            padding: 100px 40px;
            font-family: "SF Mono", monospace;
            font-size: 10px;
            display: flex;
            justify-content: space-between;
        }

        footer a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MORPH</div>
    </header>

    <nav>
        <a href="#">SEQUENCE 1.0</a>
        <a href="#">ARCHIVE</a>
    </nav>

    <main>
        <div class="test-box">SCROLL UP TO SEE LIQUID EFFECT</div>
        <div class="test-box" style="background: #e9e9e9;">CONTENT BLOCK 01</div>
        <div class="test-box" style="background: #f5f5f5;">CONTENT BLOCK 02</div>
    </main>

    <footer>
        <div>DESIGN BY TAEHAN LEE</div>
        <div>
            <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
        </div>
    </footer>

</body>
</html>
