<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
            min-height: 200vh;
        }

        /* --- 1. Liquid Glass Header (Clear Water Drop Effect) --- */
        header {
            position: fixed;
            top: 25px; 
            left: 25px;
            right: 25px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100; 
            border-radius: 50px; 
            
            /* PURE CLEAR WATER: 하얀색 그라데이션을 완전히 빼고 투명하게 만듦 */
            background: rgba(255, 255, 255, 0.01); 
            
            /* MAGNIFYING LENS: 블러를 줄이고 대비를 살려 돋보기처럼 뒤가 투명하게 굴절됨 */
            backdrop-filter: blur(8px) brightness(1.05) contrast(1.05);
            -webkit-backdrop-filter: blur(8px) brightness(1.05) contrast(1.05);
            
            /* SHARP HIGHLIGHTS: 물방울처럼 위쪽에만 날카롭고 쨍하게 맺히는 빛 반사 */
            border-top: 1.5px solid rgba(255, 255, 255, 0.7);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
            border-right: 1px solid rgba(0, 0, 0, 0.03);
            
            /* 3D VOLUME: 마음에 드셨던 입체 그림자 유지 + 내부에 하얗게 뜨는 걸 줄이고 얇은 빛만 남김 */
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.06), /* 맘에 드셨던 바깥 그림자 */
                inset 0 4px 6px rgba(255, 255, 255, 0.5), /* 얇고 쨍한 물방울 하이라이트 */
                inset 0 -5px 15px rgba(0, 0, 0, 0.02); /* 물방울 아래쪽 굴절 */
        }

        /* Menu Trigger (PC version) */
        .menu-trigger {
            position: absolute;
            left: 50px; 
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 15px;
            padding: 10px;
            transition: opacity 0.3s;
        }

        .menu-trigger:hover {
            opacity: 0.5;
        }

        /* All-Black Burger Icon */
        .burger-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .burger-icon span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: #000000; 
        }

        .menu-text {
            font-size: 14px;
            font-weight: 500;
        }

        /* Logo (PC version) */
        .logo {
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.6em;
            color: #000000;
        }

        /* --- 2. Sliding Side Menu --- */
        #sideMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px; 
            height: 100vh;
            background-color: #f2f2f2; 
            z-index: 9999; 
            padding: 150px 50px 50px 50px;
            transform: translateX(-100%); 
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 15px 0 40px rgba(0,0,0,0.03);
        }

        #sideMenu.active {
            transform: translateX(0);
        }

        .menu-item {
            display: block;
            font-size: 16px;
            text-decoration: none;
            color: #000;
            margin-bottom: 30px;
            font-weight: 400;
            transition: opacity 0.3s;
        }
        
        .menu-item::after { 
            content: " →"; 
        }
        
        .menu-item:hover { 
            opacity: 0.4; 
        }

        .close-btn {
            position: absolute;
            top: 55px;
            right: 40px;
            font-size: 13px;
            cursor: pointer;
            color: #999;
        }

        /* --- 3. Content Background --- */
        .info {
            font-size: 14px;
            line-height: 1.6;
            margin-top: 150px;
            font-weight: 400;
        }

        footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            width: 100%;
            text-align: center;
        }

        footer a {
            color: #888;
            text-decoration: none;
            border-bottom: 1px solid #eee;
            padding-bottom: 2px;
            transition: color 0.3s;
        }

        footer a:hover {
            color: #000;
            border-bottom-color: #000;
        }

        /* --- 4. MOBILE SPECIFIC FIXES --- */
        @media (max-width: 768px) {
            header {
                justify-content: space-between; 
                padding: 0 25px; 
            }

            .menu-trigger {
                position: relative; 
                left: 0; 
                gap: 10px;
                padding: 5px;
            }

            .burger-icon span {
                width: 22px; 
            }

            .menu-text {
                font-size: 12px;
            }

            .logo {
                font-size: 18px;
