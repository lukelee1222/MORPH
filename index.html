<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
            transition: background-color 0.6s ease;
        }

        /* --- 1. 고정 헤더 (PC 기본 설정 유지) --- */
        header {
            position: fixed; top: 25px; left: 25px; right: 25px; height: 90px;
            display: flex; align-items: center; justify-content: center; /* PC: 로고 중앙 정렬 */
            z-index: 1000; 
            border-radius: 50px; 
            background: rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        
        /* PC 메뉴 위치 (왼쪽 고정) */
        .menu-trigger { 
            position: absolute; left: 50px; 
            display: flex; align-items: center; cursor: pointer; gap: 15px; 
        }
        .burger-icon { display: flex; flex-direction: column; gap: 5px; }
        .burger-icon span { display: block; width: 25px; height: 2px; background-color: #000000; }
        .menu-text { font-size: 14px; font-weight: 500; }
        
        /* PC 로고 위치 (중앙) */
        .logo { 
            font-weight: 500; font-size: 22px; letter-spacing: 0.6em; 
            color: #000000; text-decoration: none; cursor: pointer; 
        }

        /* --- 2. 왼쪽 사이드 메뉴 --- */
        #sideMenu {
            position: fixed; top: 0; left: 0; width: 320px; height: 100vh;
            background-color: #f2f2f2; z-index: 9999; padding: 150px 50px 50px 50px;
            transform: translateX(-100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; box-shadow: 15px 0 40px rgba(0,0,0,0.03);
        }
        #sideMenu.active { transform: translateX(0); }
        .menu-item { display: block; font-size: 16px; text-decoration: none; color: #000; margin-bottom: 30px; font-weight: 400; cursor: pointer; }
        .menu-item::after { content: " →"; }
        .close-btn { position: absolute; top: 55px; right: 40px; font-size: 13px; cursor: pointer; color: #999; }

        /* --- 3. 공통 섹션 스타일 --- */
        #mainContent, #archiveContent, #labContent { margin-top: 150px; transition: opacity 0.5s ease; }
        .info { font-size: 14px; line-height: 1.6; }

        /* --- 4. Archive Gallery (리퀴드 글래스 호버) --- */
        .gallery-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
            max-width: 1400px; margin: 0 auto 100px auto;
        }
        .gallery-item {
            position: relative; aspect-ratio: 16 / 10; background-color: #e8e8e8;
            overflow: hidden; cursor: pointer;
        }
        .item-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(15px) saturate(150%); -webkit-backdrop-filter: blur(15px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.4s ease; z-index: 2;
        }
        .gallery-item:hover .item-overlay { opacity: 1; }
        .item-text { font-size: 13px; font-weight: 500; color: #000; letter-spacing: 0.1em; text-align: center; }

        /* --- 5. L.A.B (포스트잇 & 검정 핀) --- */
        #labContent { display: flex; justify-content: center; align-items: flex-start; min-height: 80vh; }
        .post-it {
            position: relative; width: 300px; height: 300px; background-color: #ffffff;
            box-shadow: 5px 15px 30px rgba(0,0,0,0.05); padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; transform: rotate(-1deg);
        }
        .pin {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 12px; height: 12px; background-color: #000; border-radius: 50%;
        }
        .lab-text { font-size: 12px; color: #333; line-height: 1.8; }

        /* --- 6. 기타 --- */
        #wipContent { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; display: none; align-items: center; justify-content: center; z-index: 10; }
        .glass-pill { padding: 18px 45px; border-radius: 50px; font-size: 14px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.5); }
        footer { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 13px; width: 100%; text-align: center; z-index: 10; }
        footer a { color: #888; text-decoration: none; }

        /* --- 모바일 최적화 (이 부분에서 겹침 해결) --- */
        @media (max-width: 768px) {
            header { 
                height: 70px; top: 15px; left: 15px; right: 15px; 
                padding: 0 20px; border-radius: 35px;
                justify-content: space-between; /* 모바일만 양 끝으로 정렬 */
            }
            .menu-trigger { 
                position: relative; left: 0; /* 모바일에서는 absolute 해제 */
                gap: 10px; 
            }
            .menu-text { display: none; } /* 모바일에서 글자 숨겨서 공간 확보 */
            
            .logo { 
                font-size: 16px; 
                letter-spacing: 0.3em;
                margin-right: 0; 
            }
            
            #sideMenu { width: 100%; }
            .gallery-grid { grid-template-columns: 1fr; }
            #mainContent, #archiveContent, #labContent { margin-top: 120px; }
        }
    </style>
</head>
<body id="body">

    <header>
        <div class="menu-trigger" id="menuBtn">
            <div class="burger-icon"><span></span><span></span><span></span></div>
            <div class="menu-text">MENU</div>
        </div>
        <div class="logo" id="logoBtn">MORPH</div>
    </header>

    <div id="sideMenu">
        <div class="close-btn" id="closeBtn">CLOSE</div>
        <div class="menu-item" id="btnSequence">SEQUENCE 1.0</div>
        <div class="menu-item" id="btnLab">L.A.B</div>
        <div class="menu-item" id="btnArchive">ARCHIVE</div>
    </div>

    <div id="mainContent">
        <div class="info">TAEHAN LEE<br>NEW YORK, US</div>
    </div>

    <div id="archiveContent" style="display: none; opacity: 0;">
        <div class="gallery-grid">
            <div class="gallery-item">
                <div class="item-overlay"><span class="item-text">NEXT (Alinea Group)</span></div>
            </div>
            <div class="gallery-item">
                <div class="item-overlay"><span class="item-text">?</span></div>
            </div>
            <div class="gallery-item">
                <div class="item-overlay"><span class="item-text">?</span></div>
            </div>
            <div class="gallery-item">
                <div class="item-overlay"><span class="item-text">?</span></div>
            </div>
        </div>
    </div>

    <div id="labContent" style="display: none; opacity: 0;">
        <div class="post-it">
            <div class="pin"></div>
            <div class="lab-text">
                MORPH L.A.B<br>
                EXPERIMENTAL ARCHIVE<br>
                2026. 03. 16
            </div>
        </div>
    </div>

    <div id="wipContent">
        <div class="glass-pill">WORK IN PROGRESS</div>
    </div>

    <footer><a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a></footer>

    <script>
        const body = document.getElementById('body');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');
        const sideMenu = document.getElementById('sideMenu');
        const logoBtn = document.getElementById('logoBtn');
        
        const sections = {
            main: document.getElementById('mainContent'),
            archive: document.getElementById('archiveContent'),
            lab: document.getElementById('labContent'),
            wip: document.getElementById('wipContent')
        };

        function hideAll() {
            Object.values(sections).forEach(s => { s.style.display = 'none'; s.style.opacity = '0'; });
            sideMenu.classList.remove('active');
        }

        function showSection(id, bgColor = "#ffffff") {
            hideAll();
            body.style.backgroundColor = bgColor;
            setTimeout(() => {
                const s = sections[id];
                if(id === 'archive') s.style.display = 'block';
                else s.style.display = 'flex';
                setTimeout(() => s.style.opacity = '1', 50);
            }, 300);
        }

        menuBtn.addEventListener('click', () => sideMenu.classList.add('active'));
        closeBtn.addEventListener('click', () => sideMenu.classList.remove('active'));
        logoBtn.addEventListener('click', () => showSection('main', '#ffffff'));
        
        document.getElementById('btnSequence').addEventListener('click', () => showSection('wip', '#f2f2f2'));
        document.getElementById('btnLab').addEventListener('click', () => showSection('lab', '#f2f2f2'));
        document.getElementById('btnArchive').addEventListener('click', () => showSection('archive', '#f2f2f2'));
    </script>
</body>
</html>
