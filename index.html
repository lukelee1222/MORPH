<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
            min-height: 200vh; /* Scroll to see the glass effect */
        }

        /* --- 1. Liquid Glass Header (Unified for PC & Mobile) --- */
        header {
            position: fixed;
            top: 25px; 
            left: 25px;
            right: 25px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100; 
            border-radius: 50px; 
            
            /* APPLE LIQUID GLASS EFFECT */
            background: rgba(255, 255, 255, 0.12); 
            
            /* High-performance blur for both PC and Mobile (Safari/Chrome) */
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            
            /* Subtle glass borders */
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }

        .menu-trigger {
            position: absolute;
            left: 50px; 
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 15px;
            padding: 10px;
            transition: opacity 0.3s;
        }

        .menu-trigger:hover {
            opacity: 0.5;
        }

        .burger-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .burger-icon span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: #000000; 
        }

        .menu-text {
            font-size: 14px;
            font-weight: 500;
        }

        .logo {
            font-weight: 500;
            font-size: 22px;
            letter-spacing: 0.6em;
            color: #000000;
        }

        /* --- 2. Sliding Side Menu --- */
        #sideMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px; 
            height: 100vh;
            background-color: #f2f2f2; 
            z-index: 9999; 
            padding: 150px 50px 50px 50px;
            transform: translateX(-100%); 
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 15px 0 40px rgba(0,0,0,0.03);
        }

        #sideMenu.active {
            transform: translateX(0);
        }

        .menu-item {
            display: block;
            font-size: 16px;
            text-decoration: none;
            color: #000;
            margin-bottom: 30px;
            font-weight: 400;
        }
        
        .menu-item::after { content: " →"; }

        .close-btn {
            position: absolute;
            top: 55px;
            right: 40px;
            font-size: 13px;
            cursor: pointer;
            color: #999;
        }

        /* --- 3. Content --- */
        .info {
            font-size: 14px;
            line-height: 1.6;
            margin-top: 150px;
            font-weight: 400;
        }

        footer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            width: 100%;
            text-align: center;
        }

        footer a {
            color: #888;
            text-decoration: none;
            border-bottom: 1px solid #eee;
        }

        /* --- 4. MOBILE FIX --- */
        @media (max-width: 768px) {
            header {
                height: 70px; /* Slimmer for mobile but keeps effect */
                top: 15px;
                left: 15px;
                right: 15px;
                justify-content: space-between; 
                padding: 0 25px;
                border-radius: 35px; /* Adjust radius for mobile size */
            }

            .menu-trigger {
                position: relative; 
                left: 0; 
                padding: 5px;
            }

            .logo {
                font-size: 16px;
                letter-spacing: 0.3em;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-trigger" id="menuBtn">
            <div class="burger-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="menu-text">MENU</div>
        </div>
        <div class="logo">MORPH</div>
    </header>

    <div id="sideMenu">
        <div class="close-btn" id="closeBtn">CLOSE</div>
        <a href="#" class="menu-item">SEQUENCE 1.0</a>
        <a href="#" class="menu-item">ARCHIVE</a>
    </div>

    <div class="info">
        TAEHAN LEE<br>
        NEW YORK, US
    </div>

    <footer>
        <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('menuBtn');
            const closeBtn = document.getElementById('closeBtn');
            const sideMenu = document.getElementById('sideMenu');

            menuBtn.addEventListener('click', () => {
                sideMenu.classList.add('active');
            });

            closeBtn.addEventListener('click', () => {
                sideMenu.classList.remove('active');
            });
        });
    </script>

</body>
</html>
