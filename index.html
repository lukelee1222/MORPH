<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            -webkit-font-smoothing: antialiased;
            min-height: 250vh; /* 스크롤을 충분히 만들어 효과 확인 */
        }

        /* --- 초투명 리퀴드 글래스 헤더 --- */
        header {
            position: fixed;
            top: 20px; /* 화면 상단에서 살짝 띄워 물방울 느낌 강조 */
            left: 5%;
            width: 90%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border-radius: 20px; /* 모서리를 둥글게 해서 더 물방울처럼 */

            /* 극도로 낮은 투명도 (0.1) */
            background: rgba(255, 255, 255, 0.1); 
            
            /* 블러 수치를 조절해 맑은 느낌 유지 */
            backdrop-filter: blur(15px) saturate(150%);
            -webkit-backdrop-filter: blur(15px) saturate(150%);
            
            /* 유리 가장자리의 하이라이트 (이게 물방울 질감을 만듭니다) */
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.6em;
            color: rgba(0, 0, 0, 0.8);
        }

        /* --- 콘텐츠 레이아웃 --- */
        nav {
            margin-top: 160px;
            padding: 0 50px;
            display: flex;
            gap: 50px;
        }

        nav a {
            text-decoration: none;
            color: #999;
            font-size: 10px;
            font-family: "SF Mono", monospace;
            transition: 0.3s;
        }

        nav a:hover { color: #000; }

        main {
            padding: 50px;
        }

        /* 배경 테스트용 박스 (이 위를 지나갈 때 투명도가 보입니다) */
        .visual-element {
            width: 100%;
            height: 400px;
            margin-top: 30px;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            border-radius: 5px;
        }

        footer {
            padding: 100px 50px;
            font-family: "SF Mono", monospace;
            font-size: 10px;
            display: flex;
            justify-content: space-between;
        }

        footer a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MORPH</div>
    </header>

    <nav>
        <a href="#">SEQUENCE 1.0</a>
        <a href="#">ARCHIVE</a>
    </nav>

    <main>
        <div class="visual-element"></div>
        <div class="visual-element" style="background: #000; height: 200px;"></div> <div class="visual-element"></div>
    </main>

    <footer>
        <div>DESIGN BY TAEHAN LEE</div>
        <div>
            <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
        </div>
    </footer>

</body>
</html>
