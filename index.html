<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
            transition: background-color 0.6s ease;
        }

        /* --- 1. 고정 헤더 --- */
        header {
            position: fixed; top: 25px; left: 25px; right: 25px; height: 90px;
            display: flex; align-items: center; justify-content: center; z-index: 1000; 
            border-radius: 50px; 
            background: rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        .menu-trigger { position: absolute; left: 50px; display: flex; align-items: center; cursor: pointer; gap: 15px; padding: 10px; }
        .burger-icon { display: flex; flex-direction: column; gap: 5px; }
        .burger-icon span { display: block; width: 25px; height: 2px; background-color: #000000; }
        .menu-text { font-size: 14px; font-weight: 500; }
        .logo { font-weight: 500; font-size: 22px; letter-spacing: 0.6em; color: #000000; text-decoration: none; cursor: pointer; }

        /* --- 2. 왼쪽 사이드 메뉴 --- */
        #sideMenu {
            position: fixed; top: 0; left: 0; width: 320px; height: 100vh;
            background-color: #f2f2f2; z-index: 9999; padding: 150px 50px 50px 50px;
            transform: translateX(-100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; box-shadow: 15px 0 40px rgba(0,0,0,0.03);
        }
        #sideMenu.active { transform: translateX(0); }
        .menu-item { display: block; font-size: 16px; text-decoration: none; color: #000; margin-bottom: 30px; font-weight: 400; cursor: pointer; }
        .menu-item::after { content: " →"; }
        .close-btn { position: absolute; top: 55px; right: 40px; font-size: 13px; cursor: pointer; color: #999; }

        /* --- 3. 메인 콘텐츠 및 섹션 공통 --- */
        #mainContent, #archiveContent { margin-top: 150px; transition: opacity 0.5s ease; }
        .info { font-size: 14px; line-height: 1.6; font-weight: 400; }

        /* --- 4. Archive Gallery 레이아웃 --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2열 배치 */
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 100px auto;
        }
        .gallery-item {
            position: relative;
            aspect-ratio: 16 / 10;
            background-color: #e0e0e0; /* 이미지 없을 때 배경색 */
            overflow: hidden;
            cursor: pointer;
        }
        /* 마우스 호버 시 나타나는 흰색 불투명 오버레이 */
        .item-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.9); /* 하얀 불투명색 */
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 2;
        }
        .gallery-item:hover .item-overlay { opacity: 1; }
        .item-text {
            font-size: 14px;
            font-weight: 500;
            color: #000;
            letter-spacing: 0.1em;
        }
        /* 이미지나 프로젝트 내용을 넣을 공간 */
        .item-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- 5. Work in Progress (알약) --- */
        #wipContent {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            display: none; align-items: center; justify-content: center; z-index: 10;
        }
        .glass-pill {
            padding: 18px 45px; border-radius: 50px; font-size: 14px; font-weight: 500; letter-spacing: 0.1em; color: #000000;
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            animation: pillFadeUp 0.8s ease-out;
        }
        @keyframes pillFadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 6. 푸터 --- */
        footer { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 13px; width: 100%; text-align: center; z-index: 10; }
        footer a { color: #888; text-decoration: none; border-bottom: 1px solid #eee; }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            header { height: 70px; top: 15px; left: 15px; right: 15px; justify-content: space-between; padding: 0 25px; border-radius: 35px; }
            .menu-trigger { position: relative; left: 0; padding: 5px; gap: 10px; }
            .logo { font-size: 18px; letter-spacing: 0.4em; }
            #sideMenu { width: 100%; }
            .gallery-grid { grid-template-columns: 1fr; } /* 모바일은 1열 */
        }
    </style>
</head>
<body id="body">

    <header>
        <div class="menu-trigger" id="menuBtn">
            <div class="burger-icon"><span></span><span></span><span></span></div>
            <div class="menu-text">MENU</div>
        </div>
        <div class="logo" id="logoBtn">MORPH</div>
    </header>

    <div id="sideMenu">
        <div class="close-btn" id="closeBtn">CLOSE</div>
        <div class="menu-item" id="btnSequence">SEQUENCE 1.0</div>
        <div class="menu-item" id="btnArchive">ARCHIVE</div>
    </div>

    <div id="mainContent">
        <div class="info">
            TAEHAN LEE<br>
            NEW YORK, US
        </div>
    </div>

    <div id="archiveContent" style="display: none; opacity: 0;">
        <div class="gallery-grid">
            <div class="gallery-item">
                <div class="item-overlay">
                    <span class="item-text">NEXT (Alinea Group)</span>
                </div>
                </div>
            <div class="gallery-item">
                <div class="item-overlay">
                    <span class="item-text">NEXT (Alinea Group)</span>
                </div>
            </div>
            <div class="gallery-item">
                <div class="item-overlay">
                    <span class="item-text">NEXT (Alinea Group)</span>
                </div>
            </div>
            <div class="gallery-item">
                <div class="item-overlay">
                    <span class="item-text">NEXT (Alinea Group)</span>
                </div>
            </div>
        </div>
    </div>

    <div id="wipContent">
        <div class="glass-pill">WORK IN PROGRESS</div>
    </div>

    <footer>
        <a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a>
    </footer>

    <script>
        const body = document.getElementById('body');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');
        const sideMenu = document.getElementById('sideMenu');
        const logoBtn = document.getElementById('logoBtn');
        
        const mainContent = document.getElementById('mainContent');
        const wipContent = document.getElementById('wipContent');
        const archiveContent = document.getElementById('archiveContent');
        
        const btnSequence = document.getElementById('btnSequence');
        const btnArchive = document.getElementById('btnArchive');

        // 모든 섹션을 숨기는 함수
        function hideAllSections() {
            mainContent.style.display = "none";
            mainContent.style.opacity = "0";
            wipContent.style.display = "none";
            archiveContent.style.display = "none";
            archiveContent.style.opacity = "0";
        }

        // 1. 메뉴 열기/닫기
        menuBtn.addEventListener('click', () => sideMenu.classList.add('active'));
        closeBtn.addEventListener('click', () => sideMenu.classList.remove('active'));

        // 2. SEQUENCE 클릭 (WIP 표시)
        btnSequence.addEventListener('click', () => {
            sideMenu.classList.remove('active');
            body.style.backgroundColor = "#f2f2f2";
            hideAllSections();
            
            setTimeout(() => {
                wipContent.style.display = "flex";
            }, 300);
        });

        // 3. ARCHIVE 클릭 (갤러리 표시)
        btnArchive.addEventListener('click', () => {
            sideMenu.classList.remove('active');
            body.style.backgroundColor = "#f2f2f2";
            hideAllSections();
            
            setTimeout(() => {
                archiveContent.style.display = "block";
                setTimeout(() => archiveContent.style.opacity = "1", 50);
            }, 300);
        });

        // 4. 로고 클릭 (메인 복구)
        logoBtn.addEventListener('click', () => {
            body.style.backgroundColor = "#ffffff";
            hideAllSections();
            
            mainContent.style.display = "block";
            setTimeout(() => mainContent.style.opacity = "1", 10);
        });
    </script>

</body>
</html>
