<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 20px; /* 전체 여백 */
        }

        /* 1. 중앙 리퀴드 글래스 (태한 님 최애 디자인) */
        header {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
        }

        .logo {
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.6em;
            color: #000;
        }

        /* 2. PAF 스타일 왼쪽 상단 리스트 (이름들) */
        .info-section {
            font-size: 11px;
            line-height: 1.4;
            letter-spacing: 0.02em;
            margin-top: 100px; /* 헤더 피하기 */
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* 3. 태한 님이 말한 'Shop' 위치의 메뉴 (Sequence / Archive) */
        nav {
            margin-bottom: 60px;
        }

        .menu-item {
            display: block; /* 한 줄에 하나씩 */
            font-size: 11px;
            text-decoration: none;
            color: #000;
            margin-bottom: 4px;
        }

        .menu-item::after {
            content: " →"; /* PAF 특유의 화살표 */
        }

        .menu-item:hover {
            color: #888;
        }

        /* 4. 메인 아카이브 리스트 */
        main {
            border-top: 0.5px solid #eee;
            padding-top: 20px;
        }

        .project-row {
            font-size: 11px;
            color: #000;
            margin-bottom: 4px;
            cursor: pointer;
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 10px;
            color: #ccc;
        }
