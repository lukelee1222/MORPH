<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MORPH / TAEHAN LEE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #f2f2f2; 
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;
            transition: background-color 0.6s ease;
        }

        /* --- 1. 고정 헤더 --- */
        header {
            position: fixed; top: 25px; left: 25px; right: 25px; height: 90px;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; 
            border-radius: 50px; 
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        
        .menu-trigger { position: absolute; left: 50px; display: flex; align-items: center; cursor: pointer; gap: 15px; }
        .burger-icon { display: flex; flex-direction: column; gap: 5px; }
        .burger-icon span { display: block; width: 25px; height: 2px; background-color: #000000; }
        .menu-text { font-size: 14px; font-weight: 500; }
        .logo { font-weight: 500; font-size: 22px; letter-spacing: 0.6em; color: #000000; text-decoration: none; cursor: pointer; }

        /* --- 2. 사이드 메뉴 --- */
        #sideMenu {
            position: fixed; top: 0; left: 0; width: 320px; height: 100vh;
            background-color: #e8e8e8; 
            z-index: 9999; padding: 150px 50px 50px 50px;
            transform: translateX(-100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; 
            box-shadow: 20px 0 50px rgba(0,0,0,0.03);
        }
        #sideMenu.active { transform: translateX(0); }
        .menu-item { display: block; font-size: 16px; text-decoration: none; color: #000; margin-bottom: 30px; font-weight: 400; cursor: pointer; }
        .menu-item::after { content: " →"; }
        .close-btn { position: absolute; top: 55px; right: 40px; font-size: 13px; cursor: pointer; color: #999; }

        #mainContent, #archiveContent, #labContent, #spiceGallery { margin-top: 150px; transition: opacity 0.5s ease; }
        .info { font-size: 14px; line-height: 1.6; }

        /* --- 3. Archive 갤러리 (사이즈 원상복구) --- */
        .gallery-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
            max-width: 1400px; margin: 0 auto 100px auto;
        }
        .gallery-item {
            position: relative; 
            aspect-ratio: 16 / 10; /* 원래의 큼직한 비율로 복구 */
            background-color: #dfdfdf;
            overflow: hidden; 
            cursor: pointer;
            /* padding 제거하여 박스 꽉 차게 복구 */
        }
        .item-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(15px) saturate(150%); -webkit-backdrop-filter: blur(15px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.4s ease; z-index: 2;
        }
        .gallery-item:hover .item-overlay { opacity: 1; }
        .item-text { font-size: 13px; font-weight: 500; color: #000; letter-spacing: 0.1em; text-align: center; }

        /* --- 4. L.A.B (포스트잇) --- */
        #labContent { display: flex; justify-content: flex-start; align-items: flex-start; padding: 0 50px; gap: 30px; flex-wrap: wrap; }
        .post-it {
            position: relative; width: 280px; height: 280px; background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; transform: rotate(-1deg); cursor: pointer;
            transition: transform 0.3s ease;
        }
        .post-it:hover { transform: rotate(0deg) translateY(-5px); }
        .post-it.empty { transform: rotate(1.5deg); cursor: default; }
        .pin { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; background-color: #000; border-radius: 50%; }
        .lab-text { font-size: 13px; color: #000; line-height: 2; text-transform: none; }
        .x-mark { font-size: 11px; margin: 5px 0; color: #888; }
        .question-mark { font-size: 30px; color: #ccc; font-weight: 300; }

        /* --- 5. 상세 갤러리 (L.A.B 전용 스타일 유지) --- */
        #spiceGallery { 
            display: flex; flex-direction: row; justify-content: flex-start; align-items: flex-start;
            gap: 30px; margin: 150px 0 100px 0; padding: 0 50px; overflow-x: auto; 
        }
        .spice-item { 
            flex: 0 0 auto; 
            height: 280px; /* 포스트잇 높이와 동일하게 유지 */
            width: auto; 
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5); 
            padding: 15px; border-radius: 20px; cursor: pointer;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }
        .spice-item img { height: 100%; width: auto; display: block; border-radius: 10px; }
        .spice-title { position: fixed; top: 130px; left: 50px; font-size: 10px; color: #aaa; z-index: 5; }

        /* --- 6. 확대 보기 (Lightbox) --- */
        #imageLightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(242, 242, 242, 0.7);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 10000; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.4s ease;
        }
        .lightbox-glass {
            position: relative; width: auto; max-width: 90%; height: auto; max-height: 85%;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 30px; border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center;
        }
        .lightbox-glass img { width: auto; height: auto; max-width: 100%; max-height: 100%; border-radius: 20px; }
        .lightbox-close {
            position: absolute; top: 30px; right: 30px;
            font-size: 24px; font-weight: 300; color: #000;
            cursor: pointer; z-index: 10001; line-height: 1;
        }

        #wipContent { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; display: none; align-items: center; justify-content: center; z-index: 10; }
        .glass-pill { padding: 18px 45px; border-radius: 50px; font-size: 14px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.5); }
        
        footer { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 13px; width: 100%; text-align: center; z-index: 10; }
        footer a { color: #888; text-decoration: none; }

        @media (max-width: 768px) {
            header { height: 70px; top: 15px; left: 15px; right: 15px; padding: 0 20px; border-radius: 35px; justify-content: space-between; }
            #sideMenu { width: 100%; }
            #spiceGallery { padding: 0 30px; }
            .spice-item { height: 240px; } 
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body id="body">

    <header>
        <div class="menu-trigger" id="menuBtn">
            <div class="burger-icon"><span></span><span></span><span></span></div>
            <div class="menu-text">MENU</div>
        </div>
        <div class="logo" id="logoBtn">MORPH</div>
    </header>

    <div id="sideMenu">
        <div class="close-btn" id="closeBtn">CLOSE</div>
        <div class="menu-item" id="btnSequence">SEQUENCE 1.0</div>
        <div class="menu-item" id="btnLab">L.A.B</div>
        <div class="menu-item" id="btnArchive">ARCHIVE</div>
    </div>

    <div id="mainContent">
        <div class="info">TAEHAN LEE<br>NEW YORK, US</div>
    </div>

    <div id="archiveContent" style="display: none; opacity: 0;">
        <div class="gallery-grid">
            <div class="gallery-item">
                <div class="item-overlay"><span class="item-text">NEXT (Alinea Group)</span></div>
            </div>
            <div class="gallery-item">
                <div class="item-overlay"><span class="item-text">?</span></div>
            </div>
        </div>
    </div>

    <div id="labContent" style="display: none; opacity: 0;">
        <div class="post-it" id="btnSpiceWorld">
            <div class="pin"></div>
            <div class="lab-text">
                MORPH LAB<br>
                <div class="x-mark">x</div>
                SPICE WORLD<br>
                project.s
            </div>
        </div>
        <div class="post-it empty">
            <div class="pin"></div>
            <div class="question-mark">?</div>
        </div>
    </div>

    <div id="spiceGallery" style="display: none; opacity: 0;">
        <div class="spice-title">MORPH LAB x SPICE WORLD / IMAGES</div>
        <div class="spice-item clickable-img"><img src="IMG_2587.jpg" alt=""></div>
        <div class="spice-item clickable-img"><img src="IMG_2631 2.jpg" alt=""></div>
    </div>

    <div id="imageLightbox">
        <div class="lightbox-glass">
            <div class="lightbox-close" id="lightboxClose">✕</div>
            <img id="expandedImg" src="" alt="">
        </div>
    </div>

    <div id="wipContent">
        <div class="glass-pill">WORK IN PROGRESS</div>
    </div>

    <footer><a href="https://www.instagram.com/morph_l.a.b/" target="_blank">INSTAGRAM @MORPH_L.A.B</a></footer>

    <script>
        const body = document.getElementById('body');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');
        const sideMenu = document.getElementById('sideMenu');
        const logoBtn = document.getElementById('logoBtn');
        
        const sections = {
            main: document.getElementById('mainContent'),
            archive: document.getElementById('archiveContent'),
            lab: document.getElementById('labContent'),
            wip: document.getElementById('wipContent'),
            spice: document.getElementById('spiceGallery')
        };

        const lightbox = document.getElementById('imageLightbox');
        const expandedImg = document.getElementById('expandedImg');
        const lightboxClose = document.getElementById('lightboxClose');

        function hideAll() {
            Object.values(sections).forEach(s => { s.style.display = 'none'; s.style.opacity = '0'; });
            sideMenu.classList.remove('active');
            lightbox.style.display = 'none';
        }

        function showSection(id) {
            hideAll();
            body.style.backgroundColor = "#f2f2f2"; 
            setTimeout(() => {
                const s = sections[id];
                if(id === 'archive' || id === 'spice') s.style.display = 'flex'; 
                else s.style.display = 'flex';
                setTimeout(() => s.style.opacity = '1', 50);
            }, 300);
        }

        menuBtn.addEventListener('click', () => sideMenu.classList.add('active'));
        closeBtn.addEventListener('click', () => sideMenu.classList.remove('active'));
        logoBtn.addEventListener('click', () => showSection('main'));
        
        document.getElementById('btnSequence').addEventListener('click', () => showSection('wip'));
        document.getElementById('btnLab').addEventListener('click', () => showSection('lab'));
        document.getElementById('btnArchive').addEventListener('click', () => showSection('archive'));
        document.getElementById('btnSpiceWorld').addEventListener('click', () => showSection('spice'));

        document.querySelectorAll('.clickable-img').forEach(item => {
            item.addEventListener('click', function() {
                const imgSrc = this.querySelector('img').src;
                expandedImg.src = imgSrc;
                lightbox.style.display = 'flex';
                setTimeout(() => lightbox.style.opacity = '1', 10);
            });
        });

        lightboxClose.addEventListener('click', () => {
            lightbox.style.opacity = '0';
            setTimeout(() => lightbox.style.display = 'none', 400);
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) lightboxClose.click();
        });
    </script>
</body>
</html>
