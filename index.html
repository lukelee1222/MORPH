        * {
            margin: 0;
            padding: 0;

            padding: 40px;
            letter-spacing: 0.05em;
            overflow-x: hidden;

        /* --- 1. Liquid Glass Header --- */
        header {
            position: fixed;
            top: 25px; 
            left: 25px;
            right: 25px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999; 
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        /* Menu Trigger: Icon + Text */
        .menu-trigger {
            position: absolute;
            left: 40px;
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 15px;
            padding: 15px; 
            transition: opacity 0.3s;
        }
        .menu-trigger:hover {
            opacity: 0.5;
        }
